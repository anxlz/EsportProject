name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: esports_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/esports_test
      TEST_REDIS_URL: redis://localhost:6379/1
      NEXT_TELEMETRY_DISABLED: '1'
      # PDF export tests: the runner's preinstalled Chrome, and poppler for pdftotext/pdffonts.
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Poppler (PDF text extraction in export tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Formatting
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (shared, API integration against Postgres + Redis, web catalogs)
        run: bun run test
      - name: Build web app
        run: bun run --cwd apps/web build
        env:
          API_URL: http://localhost:4000
