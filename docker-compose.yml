# Local development services only (Postgres + Redis). Production uses Supabase and a hosted
# Redis; this file is never deployed. The password below is a throwaway local value.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: esports_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
  redis:
    image: redis:7
    ports: ['6379:6379']
  # Optional local model server. Pull a model separately with `ollama pull llama3.2`,
  # then set LLM_BASE_URL=http://localhost:11434/v1 and LLM_MODEL=llama3.2 in apps/api/.env.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports: ['11434:11434']
  #   volumes:
  #     - ollama:/root/.ollama
volumes:
  pgdata:
  # ollama:
